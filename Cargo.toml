[package]
name = "imageio"
version = "0.8.2"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/doom-fish/imageio-rs"
repository = "https://github.com/doom-fish/imageio-rs"
description = "Safe Rust bindings for Apple's ImageIO framework with a Swift bridge, typed property helpers, thumbnails, HEIF/APNG tooling, and optional raw FFI on macOS"
authors = ["Per Johansson <per@doom.fish>"]
keywords = ["image", "png", "jpeg", "heic", "macos"]
categories = ["api-bindings", "os::macos-apis", "multimedia::images"]
rust-version = "1.76"
readme = "README.md"
build = "build.rs"
include = [
    "src/**/*",
    "swift-bridge/Package.swift",
    "swift-bridge/Sources/**/*",
    "examples/**/*",
    "tests/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "COVERAGE.md",
    "LICENSE-*",
    "CHANGELOG.md",
]

[features]
default = []
raw-ffi = []

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[lib]
name = "imageio"
crate-type = ["lib"]

[dependencies]
apple-cf = { version = ">=0.9, <0.10", default-features = false, features = ["cg"] }
doom-fish-utils = { version = ">=0.1, <0.3", default-features = false }

[dev-dependencies]
regex-lite = "0.1"

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[profile.release]
debug = "full"
strip = "none"

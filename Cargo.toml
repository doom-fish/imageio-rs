[package]
name = "imageio"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/doom-fish/imageio-rs"
repository = "https://github.com/doom-fish/imageio-rs"
description = "Safe Rust bindings for Apple's ImageIO framework — full public header coverage with metadata, animation, incremental sources, and BGRA decode on macOS"
authors = ["Per Johansson <per@doom.fish>"]
keywords = ["image", "png", "jpeg", "heic", "macos"]
categories = ["api-bindings", "os::macos-apis", "multimedia::images"]
rust-version = "1.76"
readme = "README.md"
build = "build.rs"
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
    "CHANGELOG.md",
]

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[lib]
name = "imageio"
crate-type = ["lib"]

[dependencies]
block2 = "0.5.1"
objc2 = "0.5.2"

[dev-dependencies]
regex-lite = "0.1"

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[[example]]
name = "01_read_image"

[[example]]
name = "02_convert_format"

[profile.release]
debug = "full"
strip = "none"

[[example]]
name = "02_data_round_trip"

[[example]]
name = "03_incremental_source"

[[example]]
name = "04_metadata"

[[example]]
name = "05_animation"

[[example]]
name = "06_copy_image_source"
